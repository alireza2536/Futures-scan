name: Keep free exchange-test API awake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-api-test-awake.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and health-check the exchange API test service
        shell: bash
        run: |
          set -euo pipefail
          url="https://exchange-api-connectivity-test.onrender.com/health"
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5"
            if curl --fail --silent --show-error --max-time 120 "$url"; then
              echo
              echo "Exchange API test service is healthy."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "Exchange API test service did not become healthy." >&2
          exit 1
