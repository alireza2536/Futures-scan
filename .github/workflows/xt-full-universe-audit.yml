name: XT full USDT crypto perpetual universe audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/xt-full-universe-audit.mjs"
      - ".github/workflows/xt-full-universe-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check current OI for every officially classified XT crypto perpetual
        run: node .github/audits/xt-full-universe-audit.mjs
      - name: Upload complete XT universe report
        if: always() && hashFiles('xt-full-universe-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xt-full-universe-audit
          path: xt-full-universe-audit.json
          retention-days: 14
