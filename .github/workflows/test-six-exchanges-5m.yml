name: Six Exchange 5m Live Data Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-six-exchanges-5m.yml'
      - 'scripts/test-six-exchanges-5m.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  test-5m:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify dependency installation
        run: npm ls --depth=0
      - name: Run 5m history and indicator test
        run: node scripts/test-six-exchanges-5m.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-exchange-5m-test-results
          path: 5m-test-results.json
          if-no-files-found: warn
          retention-days: 30
