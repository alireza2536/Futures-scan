name: HTX official TradFi labels audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/htx-official-label-audit.mjs"
      - ".github/workflows/htx-official-label-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Count official HTX TradFi classification labels
        run: node .github/audits/htx-official-label-audit.mjs
      - name: Save classification report
        if: always() && hashFiles('htx-official-label-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: htx-official-label-audit
          path: htx-official-label-audit.json
          retention-days: 14
