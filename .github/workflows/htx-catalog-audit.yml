name: HTX crypto-vs-TradFi catalog audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/htx-catalog-audit.mjs"
      - ".github/workflows/htx-catalog-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare active HTX USDT perpetuals with active spot bases
        run: node .github/audits/htx-catalog-audit.mjs
      - name: Upload HTX classification evidence
        if: always() && hashFiles('htx-catalog-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: htx-catalog-audit
          path: htx-catalog-audit.json
          retention-days: 14
