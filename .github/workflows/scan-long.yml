name: Manual Futures Long Scan

on:
  workflow_dispatch:
    inputs:
      exchanges:
        description: "Exchanges to scan (MEXC,BingX,OKX,WEEX,HTX,KuCoin,XT)"
        required: true
        default: "MEXC,BingX,OKX,WEEX,HTX,KuCoin,XT"
      max_symbols:
        description: "0 = all eligible USDT perpetual contracts per exchange; positive = test limit per exchange"
        required: true
        default: "0"
      concurrency:
        description: "Parallel symbol requests (1-5)"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CCXT adapters
        run: npm install --no-save --no-package-lock ccxt
      - name: Test indicator and strategy formulas
        run: |
          node --test scripts/test-indicators.mjs
          node --test scripts/test-strategy.mjs
      - name: Scan selected futures exchanges
        env:
          EXCHANGES: ${{ inputs.exchanges }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: node scripts/scan-long.mjs
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-long-scan-results
          path: scan-results.json
          if-no-files-found: ignore
          retention-days: 7
