name: Manual Futures Long Scan

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan (market data and indicators only)"
        type: choice
        required: true
        default: "5m"
        options:
          - "5m"
          - "15m"
          - "1h"
          - "2h"
          - "4h"
          - "1d"
      exchanges:
        description: "Approved six exchanges"
        required: true
        default: "OKX,MEXC,BINGX,WEEX,KUCOIN,XT"
      max_symbols:
        description: "0 = all eligible USDT perpetual contracts; positive = test limit"
        required: true
        default: "0"
      concurrency:
        description: "Parallel symbol requests (1-5)"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Test indicator and strategy formulas
        run: |
          node --test scripts/test-indicators.mjs
          node --test scripts/test-strategy.mjs
      - name: Scan selected futures exchanges
        env:
          TIMEFRAME: ${{ inputs.timeframe }}
          EXCHANGES: ${{ inputs.exchanges }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_DATA: "true"
        run: node scripts/scan-long.mjs
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-long-scan-results
          path: scan-results.json
          if-no-files-found: ignore
          retention-days: 7
