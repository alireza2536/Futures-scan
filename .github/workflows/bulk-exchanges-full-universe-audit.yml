name: MEXC OKX KuCoin full USDT crypto OI audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/bulk-exchanges-full-universe-audit.mjs"
      - ".github/workflows/bulk-exchanges-full-universe-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all active MEXC OKX and KuCoin crypto USDT perpetual OI rows
        run: node .github/audits/bulk-exchanges-full-universe-audit.mjs
      - name: Upload bulk exchange universe report
        if: always() && hashFiles('bulk-exchanges-full-universe-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bulk-exchanges-full-universe-audit
          path: bulk-exchanges-full-universe-audit.json
          retention-days: 14
