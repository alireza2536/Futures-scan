name: HTX classification endpoint variants

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/htx-classification-variants.mjs"
      - ".github/workflows/htx-classification-variants.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare HTX catalog parameters and currency registries
        run: node .github/audits/htx-classification-variants.mjs
      - name: Save classification evidence
        if: always() && hashFiles('htx-classification-variants.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: htx-classification-variants
          path: htx-classification-variants.json
          retention-days: 14
