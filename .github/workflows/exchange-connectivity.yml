name: Exchange API connectivity and indicator history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run deterministic indicator tests
        run: node --test scripts/test-indicators.mjs
      - name: Run CCI1000 strategy tests
        run: node --test scripts/test-strategy.mjs
      - name: Install CCXT adapters for final six exchanges
        run: npm install --no-save --no-package-lock ccxt
      - name: Test final six exchanges across all five intraday timeframes, including 5m
        run: node scripts/check-final-seven-exchanges.mjs
      - name: Upload final six-exchange API report
        if: always() && hashFiles('final-six-exchange-api-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: final-six-exchange-api-report
          path: final-six-exchange-api-report.json
          if-no-files-found: ignore
          retention-days: 14
