name: Exchange API connectivity and indicator history

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/exchange-connectivity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/exchange-connectivity.yml"

permissions:
  contents: read

jobs:
  exchange-data-qualification:
    name: Seven-exchange API and timeframe data qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test unique asset grouping
        run: node --test scripts/test-unique-assets.mjs
      - name: Test initial universe entry gate
        run: node --test scripts/test-initial-filter.mjs
      - name: Run deterministic indicator calculation tests
        run: node --test scripts/test-indicators.mjs
      - name: Install CCXT adapters for final seven exchanges
        run: npm install --no-save --no-package-lock ccxt
      - name: Qualify public API, closed-candle history, freshness and indicators on all five timeframes
        run: node scripts/check-final-seven-exchanges.mjs
      - name: Upload seven-exchange timeframe qualification report
        if: always() && hashFiles('final-seven-exchange-api-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: final-seven-exchange-timeframe-report
          path: final-seven-exchange-api-report.json
          if-no-files-found: ignore
          retention-days: 14

  direction-strategy-validation:
    name: Separate LONG strategy and scanner smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run LONG strategy unit tests
        run: node --test scripts/test-strategy.mjs
      - name: Smoke-test currently implemented scanner adapters (OKX and MEXC only)
        env:
          EXCHANGES: OKX,MEXC
          SYMBOLS: XRP-USDT-SWAP,XRP_USDT
          CONCURRENCY: "1"
          TIMEFRAMES: "15m,1h,2h,4h,1d"
          REQUIRE_DATA: "true"
        run: node scripts/scan-long.mjs
      - name: Upload scanner smoke-test results
        if: always() && hashFiles('scan-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: live-scanner-smoke-test
          path: scan-results.json
          if-no-files-found: ignore
          retention-days: 14
