name: WEEX full USDT perpetual universe audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audits/weex-full-universe-audit.mjs"
      - ".github/workflows/weex-full-universe-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check every active WEEX USDT perpetual Open Interest endpoint
        run: node .github/audits/weex-full-universe-audit.mjs
      - name: Upload complete WEEX universe report
        if: always() && hashFiles('weex-full-universe-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: weex-full-universe-audit
          path: weex-full-universe-audit.json
          retention-days: 14
